name: Shell Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd app

          echo "=== Step 1: aapt2 compile resources ==="
          mkdir -p build/compiled_res
          $ANDROID_HOME/build-tools/34.0.0/aapt2 compile \
            --dir src/main/res \
            -o build/compiled_res/resources.zip 2>/dev/null || echo "(no res dir, skipping)"

          echo "=== Step 2: aapt2 link ==="
          mkdir -p build/apk
          $ANDROID_HOME/build-tools/34.0.0/aapt2 link \
            build/compiled_res/resources.zip \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            --manifest src/main/AndroidManifest.xml \
            --java build/gen \
            -o build/apk/base.apk \
            --auto-add-overlay 2>/dev/null || {
              echo "aapt2 link failed, trying without compiled_res..."
              $ANDROID_HOME/build-tools/34.0.0/aapt2 link \
                -I $ANDROID_HOME/platforms/android-34/android.jar \
                --manifest src/main/AndroidManifest.xml \
                --java build/gen \
                -o build/apk/base.apk \
                --auto-add-overlay
            }

          echo "=== Step 3: Compile Kotlin sources ==="
          KOTLIN_LIB=$ANDROID_HOME/../
          find /usr/local/lib -name "kotlin-stdlib*.jar" 2>/dev/null | head -5
          KOTLIN_STDLIB=$(find /usr/local/lib /opt -name "kotlin-stdlib-*.jar" 2>/dev/null | head -1)
          if [ -z "$KOTLIN_STDLIB" ]; then
            echo "Downloading kotlin-stdlib..."
            curl -sL -o /tmp/kotlin-stdlib-1.9.20.jar \
              "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.20/kotlin-stdlib-1.9.20.jar"
            KOTLIN_STDLIB=/tmp/kotlin-stdlib-1.9.20.jar
          fi

          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          CLASSES_DIR=build/classes
          mkdir -p $CLASSES_DIR

          SRC_FILES=$(find src/main/java -name "*.kt" 2>/dev/null)
          if [ -n "$SRC_FILES" ]; then
            echo "Compiling Kotlin files..."
            kotlinc -cp $ANDROID_JAR:$KOTLIN_STDLIB \
              -d $CLASSES_DIR \
              $SRC_FILES \
              build/gen/com/vaelky/deskpet/R.java 2>/dev/null || \
            kotlinc -cp $ANDROID_JAR:$KOTLIN_STDLIB \
              -d $CLASSES_DIR \
              $SRC_FILES
          fi

          echo "=== Step 4: d8 dex ==="
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          DEX_DIR=build/dex
          mkdir -p $DEX_DIR
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --lib $ANDROID_JAR \
            --output $DEX_DIR \
            $CLASSES_DIR \
            $KOTLIN_STDLIB

          echo "=== Step 5: Copy assets ==="
          if [ -d "src/main/assets" ]; then
            $ANDROID_HOME/build-tools/34.0.0/aapt2 add \
              build/apk/base.apk \
              $(find src/main/assets -type f | while read f; do echo "${f#src/main/}:$f"; done | tr '\n' ' ')
          fi

          echo "=== Step 6: Inject dex into APK ==="
          cp build/apk/base.apk build/apk/unsigned.apk
          cd build/dex
          zip -r ../../build/apk/unsigned.apk classes.dex classes2.dex 2>/dev/null || \
          zip -r ../../build/apk/unsigned.apk classes.dex 2>/dev/null || true
          cd ../..

          echo "=== Step 7: Align ==="
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 build/apk/unsigned.apk build/apk/aligned.apk

          echo "=== Step 8: Sign ==="
          keytool -genkey -v -keystore build/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=DeskPet, O=Vaelky, L=Unknown, ST=Unknown, C=CN" \
            -noprompt 2>/dev/null || echo "keystore exists or created"

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias debug \
            --key-pass pass:android \
            --out build/apk/DeskPet-debug.apk \
            build/apk/aligned.apk

          echo "=== Done ==="
          ls -la build/apk/DeskPet-debug.apk
          cp build/apk/DeskPet-debug.apk ../DeskPet-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-debug
          path: DeskPet-debug.apk