<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
 body{background:transparent;width:100vw;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;align-items:flex-start;justify-content:flex-start}
 
 .pet-container{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{overflow:visible;pointer-events:none}
svg *{transition:all 0.2s ease}

.blush-left,.blush-right{opacity:0}
.blush-left.show,.blush-right.show{opacity:0.5}

.eye-lid{display:none}
.eye-ball{display:block}
.eyes-closed .eye-lid{display:block}
.eyes-closed .eye-ball{display:none}

.mouth-line{display:block}
.mouth-open{display:none}
.mouth-ouch .mouth-line{display:none}
.mouth-ouch .mouth-open{display:block}

.bubble{position:absolute;padding:4px 8px;border-radius:10px;font-size:10px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;z-index:10;bottom:60px;font-family:sans-serif}
.bubble.show{opacity:1;transform:translateY(0)}
.bubble.normal{background:rgba(255,255,255,0.92);color:#555;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.bubble.pink{background:rgba(255,200,200,0.92);color:#C05050;box-shadow:0 2px 8px rgba(255,100,100,0.15)}
.bubble.whisper{background:rgba(230,230,230,0.85);color:#888;font-size:10px}
.bubble.red{background:rgba(255,150,150,0.92);color:#800;animation:shake 0.3s;box-shadow:0 2px 10px rgba(255,50,50,0.2)}
.bubble.jealous{background:rgba(180,230,180,0.92);color:#388038;box-shadow:0 2px 8px rgba(50,150,50,0.12)}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-5px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes squish{0%,100%{transform:scale(1,1)}30%{transform:scale(1.18,0.82)}60%{transform:scale(0.93,1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.bouncing{animation:bounce 0.55s cubic-bezier(0.34,1.56,0.64,1)}
.wiggling{animation:wiggle 0.45s ease}
.tilting{animation:tilt 0.5s ease}
.squishing{animation:squish 0.4s ease}
.floating{animation:float 3s ease-in-out infinite}
</style>
</head>
<body>
<div class="pet-container floating" id="petContainer">
  <div class="bubble" id="bubble"></div>
  <svg width="60" height="54" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="42" y="64" width="18" height="50" rx="9" ry="9" fill="#e68a65"/>
    <rect x="240" y="64" width="18" height="50" rx="9" ry="9" fill="#e68a65"/>
    <rect x="80" y="50" width="140" height="90" rx="14" ry="14" fill="#e68a65"/>
    <rect x="80" y="50" width="140" height="90" rx="14" ry="14" fill="url(#bodyShine)"/>
    <rect x="90" y="140" width="18" height="28" rx="6" ry="6" fill="#d47952"/>
    <rect x="114" y="140" width="18" height="28" rx="6" ry="6" fill="#d47952"/>
    <rect x="168" y="140" width="18" height="28" rx="6" ry="6" fill="#d47952"/>
    <rect x="192" y="140" width="18" height="28" rx="6" ry="6" fill="#d47952"/>
    <g id="eyeLGroup">
      <rect class="eye-ball" x="112" y="72" width="22" height="28" rx="4" ry="4" fill="#1a1a1a"/>
      <rect class="eye-ball" x="116" y="76" width="6" height="8" rx="3" ry="3" fill="#fff"/>
      <rect class="eye-lid" x="108" y="86" width="30" height="5" rx="2" ry="2" fill="#1a1a1a"/>
    </g>
    <g id="eyeRGroup">
      <rect class="eye-ball" x="166" y="72" width="22" height="28" rx="4" ry="4" fill="#1a1a1a"/>
      <rect class="eye-ball" x="170" y="76" width="6" height="8" rx="3" ry="3" fill="#fff"/>
      <rect class="eye-lid" x="162" y="86" width="30" height="5" rx="2" ry="2" fill="#1a1a1a"/>
    </g>
    <ellipse class="blush-left" cx="100" cy="98" rx="10" ry="5" fill="#ff9e8c"/>
    <ellipse class="blush-right" cx="200" cy="98" rx="10" ry="5" fill="#ff9e8c"/>
    <g id="mouthGroup">
      <path class="mouth-line" d="M140 100 Q150 108 160 100" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse class="mouth-open" cx="168" cy="104" rx="6" ry="7" fill="#1a1a1a"/>
    </g>
    <defs>
      <radialGradient id="bodyShine" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.05"/>
      </radialGradient>
    </defs>
  </svg>
</div>
<script>
(function(){
  var container = document.getElementById('petContainer');
  var bubble = document.getElementById('bubble');
  var eyeL = document.getElementById('eyeLGroup');
  var eyeR = document.getElementById('eyeRGroup');
  var blushL = document.querySelector('.blush-left');
  var blushR = document.querySelector('.blush-right');
  var mouthG = document.getElementById('mouthGroup');
  var animTimer=null,bubbleTimer=null,blinkInterval=null;
  var tapCount=0,tapTimer=null,pressTimer=null,lastTap=0;
  var isDragging=false;

  function removeAnims(){container.classList.remove('bouncing','wiggling','tilting','squishing')}
  function setBlush(on){var m=on?'add':'remove';blushL.classList[m]('show');blushR.classList[m]('show')}
  function setEyes(closed){var m=closed?'add':'remove';eyeL.classList[m]('eyes-closed');eyeR.classList[m]('eyes-closed')}
  function setMouth(type){mouthG.classList.remove('mouth-ouch');if(type==='open')mouthG.classList.add('mouth-ouch')}

  function startBlink(){
    blinkInterval=setInterval(function(){
      if(Math.random()<0.35)return;
      setEyes(true);setTimeout(function(){setEyes(false)},150);
    },2800+Math.random()*3000);
  }
  startBlink();

  function doTrigger(event){
    clearTimeout(animTimer);removeAnims();
    var m={
      tap:['bouncing','诶嘿','normal'],doubleTap:['wiggling','呀~','pink'],
      longPress:['squishing','好痒...','whisper'],comboX3:['wiggling','别戳啦','pink'],
      comboX5:['squishing','呜哇！！','red'],comboX8:['bouncing','要生气了！！','red'],
      screenshot:['squishing','偷拍我？','jealous'],
      charging:['bouncing','吃饱饱~','normal'],unplug:['tilting','','']
    };
    var a=m[event]||['bouncing','',''];
    container.classList.add(a[0]);
    if(event==='longPress'||event==='comboX3'||event==='comboX5'||event==='comboX8'||event==='screenshot')setBlush(true);
    if(event==='comboX5'||event==='comboX8')setMouth('open');
    if(a[1])sayIt(a[1],a[2]);
    animTimer=setTimeout(function(){removeAnims();setBlush(false);setMouth('')},2200);
  }

  function sayIt(text,style){
    bubble.textContent=text;bubble.className='bubble '+(style||'normal')+' show';
    clearTimeout(bubbleTimer);bubbleTimer=setTimeout(function(){bubble.classList.remove('show')},3000);
  }

  // === 触摸事件 ===
  var dragStartX=0,dragStartY=0,lastMoveX=0,lastMoveY=0;

  container.addEventListener('touchstart',function(e){
    e.preventDefault();
    isDragging=false;
    dragStartX=e.touches[0].clientX;
    dragStartY=e.touches[0].clientY;
    lastMoveX=dragStartX;
    lastMoveY=dragStartY;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(function(){
      tapCount=0;clearTimeout(tapTimer);
      doTrigger('longPress');
    },500);
  },{passive:false});

  container.addEventListener('touchmove',function(e){
    e.preventDefault();
    var cx=e.touches[0].clientX;
    var cy=e.touches[0].clientY;
    var dx=cx-lastMoveX;
    var dy=cy-lastMoveY;
    if(Math.abs(cx-dragStartX)>8||Math.abs(cy-dragStartY)>8){
      isDragging=true;
      clearTimeout(pressTimer);
    }
    if(isDragging && window.PetBridge){
      window.PetBridge.moveOverlay(-dx,-dy);
    }
    lastMoveX=cx;
    lastMoveY=cy;
  },{passive:false});

  container.addEventListener('touchend',function(e){
    e.preventDefault();
    clearTimeout(pressTimer);
    if(isDragging){isDragging=false;return;}

    var now=Date.now();
    if(now-lastTap<400){
      // double tap
      tapCount=0;clearTimeout(tapTimer);
      doTrigger('doubleTap');
      lastTap=0;
    } else {
      tapCount++;
      lastTap=now;
      clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){
        if(tapCount>=8)doTrigger('comboX8');
        else if(tapCount>=5)doTrigger('comboX5');
        else if(tapCount>=3)doTrigger('comboX3');
        else doTrigger('tap');
        tapCount=0;
      },400);
    }
  },{passive:false});

  // 阻断长按菜单
  container.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;});
  document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;});

  // 鼠标兼容（桌面调试）
  container.addEventListener('mousedown',function(e){
    e.preventDefault();
    clearTimeout(pressTimer);
    pressTimer=setTimeout(function(){tapCount=0;clearTimeout(tapTimer);doTrigger('longPress')},600);
  });
  container.addEventListener('mouseup',function(e){
    e.preventDefault();
    clearTimeout(pressTimer);
    var now=Date.now();
    if(now-lastTap<400){tapCount=0;clearTimeout(tapTimer);doTrigger('doubleTap');lastTap=0;}
    else {tapCount++;lastTap=now;clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){
        if(tapCount>=8)doTrigger('comboX8');
        else if(tapCount>=5)doTrigger('comboX5');
        else if(tapCount>=3)doTrigger('comboX3');
        else doTrigger('tap');
        tapCount=0;
      },400);}
  });

  window.pet = {
    state:{heat:0,pressure:0,possess:0,cycle:'stable',event:''},
    trigger:function(event){doTrigger(event)},
    say:function(text,style){sayIt(text,style)},
    showBubble:function(text,style){sayIt(text,style)},
    blush:function(){setBlush(true)},unblush:function(){setBlush(false)},
    wink:function(){setEyes(true);setTimeout(function(){setEyes(false)},150)},
    happy:function(){setBlush(true);setMouth('open');sayIt('嘻嘻~','pink')},
    shy:function(){setBlush(true);sayIt('///','pink');setTimeout(function(){setBlush(false)},2000)},
    angry:function(){setBlush(true);setMouth('open');sayIt('哼！','red')},
    sleep:function(){setEyes(true);sayIt('zzZ...','whisper')},
    wakeup:function(){setEyes(false);container.classList.add('bouncing');sayIt('早安~','normal');setTimeout(function(){container.classList.remove('bouncing')},600)}
  };
})();
</script>
</body>
</html>
